name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Release configuration builds a self-contained single-file exe
      # (RuntimeIdentifier/SelfContained/PublishSingleFile are set in the .csproj).
      - name: Publish single file
        run: dotnet publish src/Witcher3FontTool -c Release -o publish

      - name: Smoke test (generate + verify with a system font)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = Join-Path $env:GITHUB_WORKSPACE "publish/Witcher3FontTool.exe"
          if (-not (Test-Path $exe)) { throw "exe not found: $exe" }
          $font = "$env:WINDIR\Fonts\arial.ttf"
          if (-not (Test-Path $font)) { $font = (Get-ChildItem "$env:WINDIR\Fonts" -Filter *.ttf | Select-Object -First 1).FullName }
          Write-Host "Using font: $font (exists: $(Test-Path $font))"
          if (-not (Test-Path $font)) { throw "no .ttf font found in $env:WINDIR\Fonts" }
          $out = Join-Path $env:GITHUB_WORKSPACE "smoke-test"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }

          # The app is a GUI-subsystem executable: PowerShell does not wait for it unless forced.
          $p = Start-Process -FilePath $exe -ArgumentList @('generate', "`"$font`"", "`"$out`"", '--english') -Wait -PassThru -NoNewWindow
          Write-Host "generate exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "generate failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path "$out/content/codebayin.bundle")) { throw "codebayin.bundle missing" }

          $p = Start-Process -FilePath $exe -ArgumentList @('verify', "`"$out/content/codebayin.bundle`"") -Wait -PassThru -NoNewWindow
          Write-Host "verify exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "verify failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path "$out/content/metadata.store")) { throw "metadata.store missing" }
          Write-Host "Smoke test passed."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Witcher3FontTool-${{ github.sha }}
          path: publish/Witcher3FontTool.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/Witcher3FontTool.exe
          generate_release_notes: true
