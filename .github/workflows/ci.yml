name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/Witcher3FontTool -c Release

      - name: Smoke test (generate + verify with a system font)
        shell: pwsh
        run: |
          $exe = "src/Witcher3FontTool/bin/Release/net8.0-windows/Witcher3FontTool.exe"
          $out = "smoke-test"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          & $exe generate "$env:WINDIR\Fonts\arial.ttf" $out --english
          if ($LASTEXITCODE -ne 0) { throw "generate failed" }
          & $exe verify "$out/content/codebayin.bundle"
          if ($LASTEXITCODE -ne 0) { throw "verify failed" }
          if (-not (Test-Path "$out/content/metadata.store")) { throw "metadata.store missing" }

      - name: Publish single file
        run: dotnet publish src/Witcher3FontTool -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Witcher3FontTool-${{ github.sha }}
          path: publish/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/Witcher3FontTool.exe
          generate_release_notes: true
